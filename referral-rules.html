<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Referral Program Rules | IVO One</title>
  <meta name="description" content="IVO One referral program information.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --surface:#FBFAF7; --surface-alt:#E7E3DC; --panel:#241E17; --accent:#A9814C; }
    * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    body { margin:0; background:var(--surface); color:var(--panel); font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
    a { color:inherit; }
    .skip-link { position:absolute; left:16px; top:-80px; padding:12px; background:var(--panel); color:var(--surface); z-index:10; }
    .skip-link:focus { top:12px; }
    header { border-bottom:1px solid rgba(36,30,23,.08); }
    .header-inner { max-width:1280px; margin:auto; min-height:76px; padding:16px 40px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; }
    .brand img { width:42px; height:auto; display:block; filter:brightness(0) saturate(100%) invert(66%) sepia(65%) saturate(492%) hue-rotate(3deg) brightness(92%) contrast(89%); }
    .brand span { font-size:14px; font-weight:800; letter-spacing:2.5px; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:12px; border-radius:30px; padding:15px 28px; background:var(--accent); color:var(--panel); text-decoration:none; font-size:14px; font-weight:700; transition:background .2s; }
    .button:hover { background:#BA925D; }
    .home-button { padding:11px 22px; color:#FBFAF7; font-size:13px; font-weight:800; white-space:nowrap; }
    main { min-height:calc(100svh - 150px); display:flex; align-items:center; justify-content:center; padding:88px 24px 72px; }
    .hero { width:100%; max-width:760px; text-align:center; }
    .icon { width:88px; height:88px; margin:0 auto 30px; display:flex; align-items:center; justify-content:center; border-radius:26px; background:var(--surface-alt); color:var(--accent); }
    .eyebrow { margin:0 0 24px; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(42px,6vw,72px); line-height:1.1; font-weight:800; letter-spacing:-.055em; }
    .percentage { color:var(--accent); }
    .description { max-width:510px; margin:28px auto 0; font-size:17px; font-weight:400; line-height:1.75; color:#62564A; }
    .help { margin:40px 0 14px; font-size:14px; color:#62564A; }
    footer { padding:24px; }
    .legal-links { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:12px 24px; }
    .legal-links a { font-size:12px; line-height:1.6; text-decoration:none; color:#62564A; }
    .legal-links a:hover { text-decoration:underline; }
    .legal-links a[aria-current="page"] { color:var(--panel); font-weight:700; }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:5px; }
    @media(max-width:600px) {
      .header-inner { padding:16px 24px; min-height:68px; }
      .home-button { padding:10px 16px; font-size:12px; }
      main { padding:64px 24px 48px; }
      .icon { width:76px; height:76px; border-radius:23px; }
      .description { font-size:16px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <div class="header-inner">
      <a class="brand" href="./index.html#top" aria-label="IVO One home">
        <img src="assets/ivo-logo.png" alt="IVO">
        <span>ONE</span>
      </a>
      <a class="button home-button" href="./index.html#top">Back to home</a>
    </div>
  </header>

  <main id="main-content">
    <section class="hero" aria-labelledby="referral-title" aria-label="Referral Program Rules">
      <div class="icon" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="16" r="6"></circle>
          <path d="M6 38v-3a12 12 0 0 1 24 0v3M32 10a6 6 0 0 1 0 12M35 27a10 10 0 0 1 7 9v2"></path>
        </svg>
      </div>
      <p class="eyebrow">IVO ONE · Referrals</p>
      <h1 id="referral-title">Refer &amp; earn<br>up to <span class="percentage">20%</span></h1>
      <p class="description">Earn commission every time your friends use their card. No limits.</p>
      <p class="help">Need help?</p>
      <a class="button" href="mailto:cs@ivoone.com?subject=Referral%20Program%20Enquiry">Contact us <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer>
    <nav class="legal-links" aria-label="Legal pages">
      <a href="./terms.html">Terms &amp; Conditions</a>
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./referral-rules.html" aria-current="page">Referral Program Rules</a>
    </nav>
  </footer>
</body>
</html>
