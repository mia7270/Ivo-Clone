<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The IVO ONE physical card is coming soon. Find updates and contact our support team.">
  <meta name="theme-color" content="#FBFAF7">
  <title>Help | IVO ONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --surface:#FBFAF7; --stone:#E7E3DC; --panel:#241E17; --ink:#1A1714; --accent:#A9814C; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; background:var(--surface); color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    a:focus-visible { outline:3px solid var(--panel); outline-offset:6px; }
    header { background:var(--surface); border-bottom:1px solid rgba(36,30,23,.08); }
    .header { max-width:1200px; margin:0 auto; padding:0 40px; height:82px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:9px; color:var(--panel); text-decoration:none; font-size:14px; font-weight:800; letter-spacing:2.5px; white-space:nowrap; }
    .brand strong { font-weight:800; }
    .home-link { display:inline-flex; align-items:center; justify-content:center; padding:11px 22px; border-radius:30px; background:var(--accent); color:var(--surface); font-size:13px; font-weight:800; text-decoration:none; }
    .home-link:hover { background:#967140; }
    main { flex:1; display:grid; place-items:center; padding:64px 24px 88px; }
    .content { width:100%; max-width:680px; text-align:center; }
    .symbol { width:88px; height:88px; display:grid; place-items:center; margin:0 auto 32px; border-radius:26px; background:var(--stone); color:var(--accent); }
    .eyebrow { margin:0 0 18px; color:#756B5E; font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase; }
    h1 { margin:0 0 24px; color:var(--panel); font-size:clamp(42px,7vw,72px); font-weight:800; line-height:1.08; letter-spacing:-.045em; }
    .description { max-width:460px; margin:0 auto; color:#6B6359; font-size:16px; line-height:1.8; }
    .support { margin-top:40px; }
    .support p { margin:0 0 16px; color:#6B6359; font-size:14px; }
    .button { display:inline-flex; min-height:48px; align-items:center; justify-content:center; gap:12px; padding:15px 28px; border-radius:30px; background:var(--accent); color:var(--panel); font-size:14px; font-weight:800; text-decoration:none; transition:background .2s; }
    .button:hover { background:#BC985F; }
    footer { padding:24px 40px; border-top:1px solid var(--stone); text-align:center; color:#756B5E; font-size:12px; line-height:1.6; }
    @media(max-width:700px) { .header { padding:0 24px; height:64px; } .home-link { padding:10px 16px; font-size:12px; } }
    @media(max-width:480px) { main { padding:48px 24px 64px; } .description { font-size:15px; } footer { padding:20px 24px; } }
    @media(prefers-reduced-motion:reduce) { .button { transition:none; } }
  </style>
<style>
    header .brand img {
      width:42px;
      height:auto;
      display:block;
      filter:brightness(0) saturate(100%) invert(66%) sepia(65%) saturate(492%) hue-rotate(3deg) brightness(92%) contrast(89%);
    }
  </style>
</head>
<body>
  <header>
    <nav class="header" aria-label="Main navigation">
      <a class="brand" href="/#top" aria-label="IVO ONE home"><img src="/assets/ivo-logo.png" alt="IVO"><span>ONE</span></a>
      <a class="home-link" href="/#top">Back to home</a>
    </nav>
  </header>
  <main>
    <section class="content" aria-labelledby="page-title">
      <div class="symbol" aria-hidden="true">
        <svg width="42" height="34" viewBox="0 0 42 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="3" width="38" height="28" rx="5" stroke="currentColor" stroke-width="2"/>
          <path d="M3 12H39M9 23H17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="eyebrow">IVO ONE · Help</p>
      <h1 id="page-title">Physical card<br>coming soon.</h1>
      <p class="description">We’re getting your IVO ONE physical card ready. Details on availability and activation will be shared here.</p>
      <div class="support">
        <p>Need help?</p>
        <a class="button" href="mailto:cs@ivoone.com">Contact us <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>
  <footer>IVO ONE. All rights reserved.</footer>
</body>
</html>
